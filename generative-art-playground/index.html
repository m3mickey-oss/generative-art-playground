<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="フローフィールド上を漂うパーティクルで模様を描く、ブラウザ完結のジェネレーティブアートプレイグラウンド。">
<title>Generative Art Playground</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel-bg: rgba(20, 20, 30, 0.85);
    --text: #e8e8f0;
    --text-dim: #9090a0;
    --accent: #7dd3fc;
    --border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text);
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 280px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    z-index: 10;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #panel.collapsed {
    transform: translateX(calc(100% + 16px));
    opacity: 0;
    pointer-events: none;
  }
  #panel h1 {
    font-size: 15px;
    margin: 0 0 4px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #panel .sub {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 14px;
    line-height: 1.5;
  }
  .row {
    margin-bottom: 12px;
  }
  .row label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .row label span.val {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 18px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 70px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover {
    background: rgba(255,255,255,0.14);
  }
  button.primary {
    background: var(--accent);
    color: #0a0a0f;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover {
    background: #a5e0fd;
  }
  #toggleBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 11;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 10px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="art" role="img" aria-label="ノイズベースのフローフィールドで描かれるジェネレーティブアート"></canvas>
<button id="toggleBtn" title="パネル切替" aria-label="パラメータパネルの表示切替">⚙</button>

<div id="panel">
  <h1>Generative Art Playground</h1>
  <p class="sub">フローフィールド上を漂うパーティクルで模様を描きます。スライダーを動かして、好みの動きを見つけてください。</p>

  <div class="row">
    <label>パーティクル数 <span class="val" id="v-count">1200</span></label>
    <input type="range" id="count" min="50" max="4000" step="50" value="1200">
  </div>
  <div class="row">
    <label>速度 <span class="val" id="v-speed">1.6</span></label>
    <input type="range" id="speed" min="0.2" max="5" step="0.1" value="1.6">
  </div>
  <div class="row">
    <label>ノイズの粗さ <span class="val" id="v-scale">0.0035</span></label>
    <input type="range" id="scale" min="0.0008" max="0.02" step="0.0002" value="0.0035">
  </div>
  <div class="row">
    <label>渦の強さ <span class="val" id="v-curl">3.2</span></label>
    <input type="range" id="curl" min="0.5" max="8" step="0.1" value="3.2">
  </div>
  <div class="row">
    <label>軌跡の長さ <span class="val" id="v-trail">6</span></label>
    <input type="range" id="trail" min="1" max="20" step="1" value="6">
  </div>
  <div class="row">
    <label>線の太さ <span class="val" id="v-width">1.1</span></label>
    <input type="range" id="width" min="0.3" max="4" step="0.1" value="1.1">
  </div>
  <div class="row">
    <label>基準の色相 <span class="val" id="v-hue">200</span></label>
    <input type="range" id="hue" min="0" max="360" step="1" value="200">
  </div>
  <div class="row">
    <label>色相の幅 <span class="val" id="v-hueRange">120</span></label>
    <input type="range" id="hueRange" min="0" max="360" step="1" value="120">
  </div>
  <div class="row">
    <label>時間の流れ <span class="val" id="v-timeSpeed">0.15</span></label>
    <input type="range" id="timeSpeed" min="0" max="1" step="0.01" value="0.15">
  </div>

  <hr>

  <div class="btn-row">
    <button id="randomizeBtn" class="primary">ランダム化</button>
    <button id="clearBtn">画面クリア</button>
  </div>
  <div class="btn-row">
    <button id="pauseBtn">一時停止</button>
    <button id="saveBtn">PNG保存</button>
  </div>

  <p class="hint">クリック／タップでその場所に渦を発生させます。⚙ボタンでパネルの表示切替。</p>
</div>

<script>
(function () {
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);

  // ---- value noise (2D + time) ----
  const NOISE_SIZE = 256;
  const perm = new Uint8Array(NOISE_SIZE * 2);
  (function seedPerm() {
    const p = new Uint8Array(NOISE_SIZE);
    for (let i = 0; i < NOISE_SIZE; i++) p[i] = i;
    for (let i = NOISE_SIZE - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < NOISE_SIZE * 2; i++) perm[i] = p[i & (NOISE_SIZE - 1)];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 7;
    const gx = [1, -1, 1, -1, 1, -1, 0, 0][h];
    const gy = [1, 1, -1, -1, 0, 0, 1, -1][h];
    return gx * x + gy * y;
  }
  function noise2(x, y) {
    const X = Math.floor(x) & (NOISE_SIZE - 1);
    const Y = Math.floor(y) & (NOISE_SIZE - 1);
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf);
    const v = fade(yf);
    const aa = perm[perm[X] + Y];
    const ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y];
    const bb = perm[perm[X + 1] + Y + 1];
    const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
    const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v); // roughly -1..1
  }

  // ---- params ----
  const params = {
    count: 1200,
    speed: 1.6,
    scale: 0.0035,
    curl: 3.2,
    trail: 6,
    width: 1.1,
    hue: 200,
    hueRange: 120,
    timeSpeed: 0.15
  };

  const ids = ['count','speed','scale','curl','trail','width','hue','hueRange','timeSpeed'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    const valEl = document.getElementById('v-' + id);
    const update = () => {
      const v = parseFloat(el.value);
      params[id] = v;
      valEl.textContent = (id === 'scale') ? v.toFixed(4) : (id === 'timeSpeed' ? v.toFixed(2) : v);
      if (id === 'count') initParticles();
    };
    el.addEventListener('input', update);
  });

  // ---- particles ----
  let particles = [];
  function initParticles() {
    const n = Math.round(params.count);
    particles = new Array(n);
    for (let i = 0; i < n; i++) {
      particles[i] = {
        x: Math.random() * W,
        y: Math.random() * H,
        px: 0, py: 0,
        life: Math.random() * 200
      };
      particles[i].px = particles[i].x;
      particles[i].py = particles[i].y;
    }
  }

  let ripples = [];
  canvas.addEventListener('pointerdown', (e) => {
    ripples.push({ x: e.clientX, y: e.clientY, t: 0 });
  });

  let t = 0;
  let paused = false;

  function angleAt(x, y) {
    let a = noise2(x * params.scale, y * params.scale + t) * Math.PI * params.curl;
    for (const r of ripples) {
      const dx = x - r.x, dy = y - r.y;
      const d2 = dx * dx + dy * dy;
      const influence = Math.exp(-d2 / 40000) * (1 - r.t / 120);
      if (influence > 0) {
        const swirl = Math.atan2(dy, dx) + Math.PI / 2;
        a = lerp(a, swirl, Math.min(influence, 1));
      }
    }
    return a;
  }

  function step() {
    if (!paused) {
      // fade trail
      ctx.fillStyle = `rgba(10, 10, 15, ${Math.max(0.02, (21 - params.trail) / 100)})`;
      ctx.fillRect(0, 0, W, H);

      ctx.lineWidth = params.width;
      ctx.lineCap = 'round';

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.px = p.x;
        p.py = p.y;
        const a = angleAt(p.x, p.y);
        p.x += Math.cos(a) * params.speed;
        p.y += Math.sin(a) * params.speed;
        p.life -= 1;

        if (p.x < 0 || p.x > W || p.y < 0 || p.y > H || p.life <= 0) {
          p.x = Math.random() * W;
          p.y = Math.random() * H;
          p.px = p.x;
          p.py = p.y;
          p.life = 150 + Math.random() * 200;
          continue;
        }

        const hue = (params.hue + (noise2(p.x * 0.01, p.y * 0.01) * 0.5 + 0.5) * params.hueRange) % 360;
        ctx.strokeStyle = `hsla(${hue}, 85%, 65%, 0.55)`;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      t += 0.002 + params.timeSpeed * 0.01;
      ripples.forEach(r => r.t += 1);
      ripples = ripples.filter(r => r.t < 120);
    }
    requestAnimationFrame(step);
  }

  // ---- buttons ----
  document.getElementById('randomizeBtn').addEventListener('click', () => {
    const rand = (min, max) => Math.random() * (max - min) + min;
    const sets = {
      count: Math.round(rand(300, 3000) / 50) * 50,
      speed: +rand(0.5, 4).toFixed(1),
      scale: +rand(0.0015, 0.012).toFixed(4),
      curl: +rand(1, 7).toFixed(1),
      trail: Math.round(rand(2, 15)),
      width: +rand(0.4, 3).toFixed(1),
      hue: Math.round(rand(0, 360)),
      hueRange: Math.round(rand(30, 300)),
      timeSpeed: +rand(0, 0.6).toFixed(2)
    };
    Object.keys(sets).forEach(id => {
      params[id] = sets[id];
      const el = document.getElementById(id);
      const valEl = document.getElementById('v-' + id);
      el.value = sets[id];
      valEl.textContent = (id === 'scale') ? sets[id].toFixed(4) : (id === 'timeSpeed' ? sets[id].toFixed(2) : sets[id]);
    });
    initParticles();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
  });

  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '再開' : '一時停止';
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `generative-art-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggleBtn').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
  });

  resize();
  initParticles();
  step();
})();
</script>

</body>
</html>
